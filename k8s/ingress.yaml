apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-api
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Strip the /api prefix before proxying: /api/accounts -> /accounts.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: finance.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-webapp
spec:
  ingressClassName: nginx
  rules:
    - host: finance.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80